name: PRWatcher — Mark Done and Unblock Dependents

on:
  pull_request:
    types: [closed]

permissions:
  issues: write
  pull-requests: read

jobs:
  on-merge:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Extract linked issue number
        id: extract
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGED_BY: ${{ github.event.pull_request.merged_by.login }}
        run: |
          # Match: Resolves #N, Closes #N, Fixes #N (case-insensitive)
          ISSUE_NUMBER=$(echo "$PR_BODY" | grep -ioP '(resolves|closes|fixes)\s+#\K[0-9]+' | head -1)
          if [ -z "$ISSUE_NUMBER" ]; then
            echo "No linked issue found in PR body. Skipping."
            echo "issue_number=" >> "$GITHUB_OUTPUT"
          else
            echo "Found linked issue: #$ISSUE_NUMBER"
            echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          fi
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "merged_by=$MERGED_BY" >> "$GITHUB_OUTPUT"

      - name: Mark issue done
        if: steps.extract.outputs.issue_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.extract.outputs.issue_number }}
          PR_URL: ${{ steps.extract.outputs.pr_url }}
          MERGED_BY: ${{ steps.extract.outputs.merged_by }}
        run: |
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # Update labels: add done, remove awaiting_review and in_progress
          gh issue edit "$ISSUE_NUMBER" \
            --add-label "done" \
            --remove-label "awaiting_review" \
            --remove-label "in_progress" \
            --repo "${{ github.repository }}" || true

          # Close the issue
          gh issue close "$ISSUE_NUMBER" \
            --repo "${{ github.repository }}" || true

          # Post DONE event comment
          gh issue comment "$ISSUE_NUMBER" \
            --repo "${{ github.repository }}" \
            --body "[metaprompter] DONE — issue #${ISSUE_NUMBER}

<!-- metaprompter-event
type: DONE
issue: ${ISSUE_NUMBER}
timestamp: ${TIMESTAMP}
pr_url: ${PR_URL}
merged_by: ${MERGED_BY}
-->"

      - name: Unblock dependents
        if: steps.extract.outputs.issue_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESOLVED_ISSUE: ${{ steps.extract.outputs.issue_number }}
        run: |
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          REPO="${{ github.repository }}"

          # Find all open issues that mention "depends on #RESOLVED_ISSUE"
          DEPENDENT_ISSUES=$(gh issue list \
            --state open \
            --json number,body,labels \
            --limit 100 \
            --repo "$REPO" \
            --jq --arg dep "#${RESOLVED_ISSUE}" \
            '[.[] | select(.body | test("depends on .*" + $dep; "i"))] | .[].number')

          if [ -z "$DEPENDENT_ISSUES" ]; then
            echo "No dependent issues found."
            exit 0
          fi

          # Get all closed issue numbers for dep resolution check
          CLOSED_ISSUES=$(gh issue list \
            --state closed \
            --json number \
            --limit 200 \
            --repo "$REPO" \
            --jq '[.[].number]')

          for DEP_ISSUE in $DEPENDENT_ISSUES; do
            echo "Checking dependent issue #$DEP_ISSUE..."

            # Get this issue's body and labels
            ISSUE_DATA=$(gh issue view "$DEP_ISSUE" \
              --repo "$REPO" \
              --json body,labels)

            ISSUE_BODY=$(echo "$ISSUE_DATA" | jq -r '.body')

            # Extract all dep numbers from "depends on #N, #M, ..."
            DEP_NUMBERS=$(echo "$ISSUE_BODY" | grep -ioP 'depends on\s+\K[#0-9, ]+' | grep -oP '[0-9]+')

            ALL_RESOLVED=true
            for DEP_NUM in $DEP_NUMBERS; do
              # Check if dep is in closed issues list
              IS_CLOSED=$(echo "$CLOSED_ISSUES" | jq --argjson n "$DEP_NUM" 'map(select(. == $n)) | length > 0')
              if [ "$IS_CLOSED" != "true" ]; then
                # Also check if it has 'done' label while still open
                HAS_DONE=$(gh issue view "$DEP_NUM" \
                  --repo "$REPO" \
                  --json labels \
                  --jq '.labels | map(.name) | any(. == "done")' 2>/dev/null || echo "false")
                if [ "$HAS_DONE" != "true" ]; then
                  echo "  Dep #$DEP_NUM not yet resolved. Skipping #$DEP_ISSUE."
                  ALL_RESOLVED=false
                  break
                fi
              fi
            done

            if [ "$ALL_RESOLVED" = "true" ]; then
              echo "  All deps resolved for #$DEP_ISSUE. Unblocking..."

              gh issue edit "$DEP_ISSUE" \
                --add-label "todo" \
                --remove-label "blocked" \
                --repo "$REPO" || true

              gh issue comment "$DEP_ISSUE" \
                --repo "$REPO" \
                --body "[metaprompter] UNBLOCKED — issue #${DEP_ISSUE}

<!-- metaprompter-event
type: UNBLOCKED
issue: ${DEP_ISSUE}
timestamp: ${TIMESTAMP}
resolved_dep: ${RESOLVED_ISSUE}
-->"
            fi
          done
