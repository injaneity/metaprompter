github:
  # Optional: auto-detected from git remote origin if empty.
  repo:
  labels:
    todo: todo
    in_progress: in_progress
    blocked: blocked
    done: done
    awaiting_review: awaiting_review

routing:
  # label → prompt template mapping (first match wins)
  # Add entries here to route issues by label to specialized worker prompts.
  frontend:
    prompt: prompts/execute/worker-frontend.md
  bug:
    prompt: prompts/execute/worker-bugfix.md

frameworks:
  default: claude
  enabled:
    - claude
    - codex
    - opencode

execute:
  max_concurrent: 1
  retry_attempts: 1
  allow_subissue_fanout: true

circuit_breaker:
  failure_threshold: 3

checks:
  test_cmd:
  lint_cmd:
